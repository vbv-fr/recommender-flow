<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recommender flow prototype</title>
<meta name="description" content="Clickable prototype: recipe flow ending at Dataset Folders, recommender-only absent and negative labels on Datasets &amp; Annotations, and the Run Recommender popup.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23FF4A00'/%3E%3Cpath d='M9 22l5-6 4 4 5-8' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff}
*{box-sizing:border-box}
button,input{font-family:inherit}
a{color:#D63F00}a:hover{color:#A83200}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:13px;height:13px;border:2px solid #F6C9B4;border-top-color:#FF4A00;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.ibtn{background:none;border:0;padding:6px;cursor:pointer;color:#52525B;display:inline-flex;align-items:center;justify-content:center;border-radius:6px}
.ibtn:hover{background:#F4F4F5}
.ibtn:disabled{color:#CFCFD4;cursor:not-allowed;background:none}
.link{background:none;border:0;padding:0;color:#D63F00;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.pbtn{height:28px;padding:0 10px;border:1px solid #C9C9CF;background:#fff;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:#3F3F46}
.pbtn:hover{border-color:#FF4A00;color:#C23A00}
.trow:hover{background:#FFF8F4}
.tip{position:relative;display:inline-flex;cursor:help;outline:none}
.tipbox{display:none;position:absolute;bottom:calc(100% + 8px);right:-8px;width:240px;background:#18181B;color:#fff;font-size:12px;font-weight:500;line-height:1.4;padding:8px 10px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:5}
.tip:hover .tipbox,.tip:focus .tipbox{display:block}
.qr{background-color:#fff;background-image:repeating-linear-gradient(0deg,#1f1f1f 0 4px,transparent 4px 9px),repeating-linear-gradient(90deg,#1f1f1f 0 4px,transparent 4px 10px)}

/* AI Model Training: replica of frinksvision-frontend ai-training-new (Tailwind classes translated) */
.fv{font-family:'Outfit',sans-serif;color:#000;font-weight:400}
.fv-btn{font-family:inherit;font-weight:600;font-size:14px;line-height:20px;padding:8px 24px;border-radius:6px;border:1px solid transparent;background:#ff4301;color:#fff;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.fv-btn:hover{background:rgba(255,67,1,.9)}
.fv-btn.border{background:transparent;border-color:#ff4301;color:#ff4301}
.fv-btn.border:hover{opacity:.7}
.fv-btn:disabled{background:#E5E7EB;color:#6B7280;cursor:not-allowed}
.fv-filter{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:#111827;cursor:pointer}
.fv-th{position:relative;padding:16px 8px;text-align:center;font-size:16px;font-weight:500;color:#fff}
.fv-th:not(:last-child)::after{content:'';position:absolute;top:10px;right:0;bottom:10px;width:2px;border-radius:16px;background:#fff}
.fv-row{display:grid;border-top:1px solid #E5E7EB;background:#fff;cursor:pointer}
.fv-row:hover{background:#F3F4F6}
.fv-td{padding:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:#000;min-width:0}
.fv-cb{width:24px;height:24px;border:1px solid #D9D9D9;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;box-shadow:0 1px 3px 0 #7A7E80,0 1px 2px -1px #7A7E80;padding:0}
.fv-cb.on{background:#ff4301}
.fv-cb:disabled{box-shadow:none;background:#E5E7EB;pointer-events:none}
.fv-tip.off{cursor:not-allowed}
.fv-tip{position:relative;display:inline-flex;align-items:center}
.fv-tipbox{display:none;position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);z-index:50;width:max-content;max-width:400px;white-space:normal;text-align:left;border:1px solid #D1D5DB;background:#F3F4F6;color:#4B5563;font-size:12px;line-height:16px;padding:4px 8px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05);pointer-events:none}
.fv-tip:hover .fv-tipbox{display:block}
.fv-chip{display:inline-flex;padding:2px 8px;font-size:14px;border-radius:12px;color:#000;background:#FACFCE;white-space:nowrap}
.fv-cls{display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;white-space:nowrap;font-size:14px;font-weight:500}
.fv-input{font-family:inherit;font-size:16px;padding:8px 12px;border-radius:6px;border:1px solid #D1D5DB;background:#fff;width:100%;color:#000}
.fv-input:focus{outline:2px solid #ff4301;outline-offset:-1px;border-color:#ff4301}
</style>
</head>
<body>
<div id="root"></div>
<template id="dc-template">
<div style="position: relative; min-height: 900px; background: #FFFFFF; font-family: 'Quicksand', 'Segoe UI', sans-serif; color: #1D1D1F; font-weight: 500">

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 16px; background: #F4F4F5; border-bottom: 1px dashed #B8B8BE; font-size: 12px; color: #52525B">
<span style="font-weight: 700; letter-spacing: 0.06em">PROTOTYPE CONTROLS</span>
<button class="pbtn" onClick="{{fillReady}}">Fill capture 5 to ready</button>
<sc-if value="{{isAnnot}}" hint-placeholder-val="{{false}}"><button class="pbtn" onClick="{{autoLabel}}">Auto-label this image</button></sc-if>
<button class="pbtn" onClick="{{goTraining}}">AI Model Training</button>
<sc-if value="{{isTraining}}" hint-placeholder-val="{{false}}"><button class="pbtn" onClick="{{goDatasets}}">Datasets &amp; Annotations</button></sc-if>
<button class="pbtn" onClick="{{reset}}">Reset</button>
<span>Recommender runs take {{runSecs}} s here (real runs take a few minutes)</span>
</div>

<sc-if value="{{isWizard}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; min-height: 860px">
<nav aria-label="Breadcrumb" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 24px; font-size: 13px; color: #3F3F46">
<span>Home</span><span style="color: #A1A1AA">›</span><span>Test Project</span><span style="color: #A1A1AA">›</span><span>Recipe Management</span><span style="color: #A1A1AA">›</span><span>variant 1</span><span style="color: #A1A1AA">›</span><span>capture 5</span><span style="color: #A1A1AA">›</span><span style="font-weight: 700; color: #18181B">Module Configuration</span>
</nav>
<div style="flex: 1; padding: 12px 16px 32px; display: flex; justify-content: center">
<div style="width: 100%; max-width: 1270px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600; padding-bottom: 12px; border-bottom: 1px solid #D4D4D8">Define Class Properties</h2>
<div style="overflow-x: auto">
<div style="min-width: 640px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FF4A00; color: #FFFFFF; font-weight: 700; font-size: 14px; min-height: 46px; align-items: center; text-align: center">
<div>Class Name</div><div>Negative Classes</div><div>Absent Case</div>
</div>
<sc-for list="{{classRows}}" as="c" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-height: 46px; align-items: center; text-align: center; border-bottom: 1px solid #EFEFF1; font-size: 14px">
<div>{{c.name}}</div>
<div style="display: flex; justify-content: center"><span style="display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; height: 32px; padding: 0 10px; border: 1px solid #E4E4E7; border-radius: 6px; color: #A1A1AA; font-size: 13px; min-width: 180px"><sc-if value="{{c.noNeg}}" hint-placeholder-val="{{true}}">Select negative classes</sc-if><sc-if value="{{c.hasNeg}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; gap: 4px"><sc-for list="{{c.negChips}}" as="ch"><span class="chip" style="height: 22px; {{ch.style}}">{{ch.label}}</span></sc-for></span></sc-if> <span aria-hidden="true">▾</span></span></div>
<div style="display: flex; justify-content: center"><input type="checkbox" checked="{{c.absent}}" disabled="{{true}}" aria-label="{{c.absentLabel}}" style="width: 18px; height: 18px; accent-color: #FF4A00; margin: 0"></div>
</div>
</sc-for>
</div>
</div>
<sc-if value="{{hasNegNote}}" hint-placeholder-val="{{true}}">
<div role="note" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 8px; font-size: 13px; color: #7C2D12; line-height: 1.45">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9.5"></circle><path d="M12 11v6M12 7.5v.01"></path></svg>
<span><strong style="font-weight: 700">Note:</strong> {{negNote}}</span>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 6px 0 10px">
<a href="#" style="font-size: 13px">Define Mutually Exclusive Classes</a>
<span style="display: inline-flex; align-items: center; height: 32px; padding: 0 20px; background: #D4D4D8; color: #71717A; border-radius: 4px; font-size: 13px; font-weight: 600">Saved</span>
</div>

<h2 style="margin: 0; font-size: 17px; font-weight: 600; padding-bottom: 12px; border-bottom: 1px solid #D4D4D8">Create Dataset Folders</h2>
<p style="margin: 0; font-size: 13px; color: #52525B">Select values from Possible Combinations to create Dataset Folders</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section style="flex: 1 1 420px; min-width: 0; border: 1px solid #E4E4E7; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700">Dataset Combinations</h3>
<p style="margin: 0; font-size: 13px; color: #52525B">Each dataset combination represents a folder containing images of certain classes.</p>
<div style="border: 1px solid #EFEFF1">
<div style="display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.5fr) 48px; background: #FF4A00; color: #FFFFFF; font-weight: 700; font-size: 14px; min-height: 44px; align-items: center">
<div style="padding: 0 16px">Folder Name</div><div style="text-align: center">Classes</div><div></div>
</div>
<sc-for list="{{wizFolders}}" as="f" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.5fr) 48px; min-height: 52px; align-items: center; border-bottom: 1px solid #EFEFF1">
<div style="padding: 0 12px"><span style="display: inline-flex; align-items: center; height: 32px; padding: 0 10px; border: 1px solid #E4E4E7; border-radius: 6px; background: #FAFAFA; font-size: 13px; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">{{f.name}}</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px"><sc-for list="{{f.chips}}" as="ch"><span class="chip" style="{{ch.style}}">{{ch.label}}</span></sc-for></div>
<div><button class="ibtn" disabled="{{f.locked}}" title="{{f.lockReason}}" aria-label="{{f.delLabel}}" onClick="{{f.del}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path></svg></button></div>
</div>
</sc-for>
</div>
</section>
<section style="flex: 1 1 420px; min-width: 0; border: 1px solid #E4E4E7; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700">Possible Combinations</h3>
<p style="margin: 0; font-size: 13px; color: #52525B">All possible combinations of classes that can be created.</p>
<div style="border: 1px solid #EFEFF1">
<div style="display: flex; justify-content: center; background: #FF4A00; color: #FFFFFF; font-weight: 700; font-size: 14px; min-height: 44px; align-items: center">Classes</div>
<sc-for list="{{wizCombos}}" as="k" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 12px; border-bottom: 1px solid #EFEFF1">
<input type="checkbox" id="{{k.id}}" checked="{{k.checked}}" disabled="{{k.locked}}" onChange="{{k.toggle}}" style="width: 18px; height: 18px; accent-color: #FF4A00; margin: 0; flex: none">
<label for="{{k.id}}" style="flex: 1; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center"><sc-for list="{{k.chips}}" as="ch"><span class="chip" style="{{ch.style}}">{{ch.label}}</span></sc-for></label>
<span style="font-size: 11px; color: #71717A; min-width: 130px; text-align: right">{{k.lockReason}}</span>
</div>
</sc-for>
</div>
</section>
</div>
</div>
</div>
<div style="border-top: 1px solid #D4D4D8; padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px">
<button aria-label="Previous step" onClick="{{prevStep}}" style="width: 40px; height: 36px; border: 1px solid #FF4A00; color: #FF4A00; background: #FFFFFF; border-radius: 6px; cursor: pointer; font-size: 16px">←</button>
<div style="display: inline-flex; align-items: center; gap: 12px; height: 36px; padding: 0 16px; border: 1px solid #E4E4E7; border-radius: 999px; font-size: 13px">
<span aria-hidden="true" style="display: inline-flex; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #FF4A00"></span><span style="width: 7px; height: 7px; border-radius: 50%; background: #FF4A00"></span></span>
<span style="color: #52525B">2 of 2</span><span style="font-weight: 700">Dataset Folders</span>
</div>
<button onClick="{{finish}}" style="height: 36px; padding: 0 22px; border: 0; background: #FF4A00; color: #FFFFFF; border-radius: 6px; font-weight: 700; font-size: 14px; cursor: pointer">Finish</button>
</div>
</div>
</sc-if>

<sc-if value="{{isDatasets}}" hint-placeholder-val="{{false}}">
<div style="padding: 0 24px 40px; display: flex; flex-direction: column; gap: 16px">
<nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 10px; padding-top: 16px; font-size: 13px; color: #3F3F46">
<span>Home</span><span style="color: #A1A1AA">›</span><span>Test Project</span><span style="color: #A1A1AA">›</span><span style="font-weight: 700; color: #18181B">Datasets &amp; Annotations</span>
</nav>
<sc-if value="{{showBanner}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid #F6C7AE; background: #FFF6F1; border-radius: 10px; font-size: 13px; color: #3F3F46">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<strong style="font-weight: 700; color: #18181B">Folders for capture 5 are ready</strong>
<span>Upload images into each folder and annotate them. Once every class has 5 labels, each absent class 3 absent labels and each negative class 5 negative labels, run the recommender from the top right.</span>
</div>
<button class="ibtn" aria-label="Dismiss" onClick="{{dismissBanner}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{filters}}" as="fl" hint-placeholder-count="4">
<button style="position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #27272A; cursor: pointer">{{fl.label}} <span aria-hidden="true">▾</span><span style="position: absolute; top: 0; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: #FF4A00; color: #FFFFFF; font-size: 10px; display: inline-flex; align-items: center; justify-content: center">{{fl.n}}</span></button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<sc-if value="{{anyRunning}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #C23A00; font-weight: 600"><span class="spin"></span>{{runningText}}</span></sc-if>
<button onClick="{{openModal}}" style="height: 40px; padding: 0 10px 0 16px; background: #FF4A00; color: #FFFFFF; border: 0; border-radius: 8px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 10px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>
Run Recommender
<span style="border-radius: 999px; padding: 2px 9px; font-size: 12px; {{readyPillStyle}}">{{readyText}}</span>
</button>
</div>
</div>

<div style="overflow-x: auto; border: 1px solid #EFEFF1; border-radius: 4px">
<div style="min-width: 1260px">
<div style="display: grid; grid-template-columns: 110px 130px minmax(250px, 1.6fr) minmax(200px, 1.2fr) 160px 110px 120px 120px 70px; background: #FF4A00; color: #FFFFFF; font-weight: 700; font-size: 14px; min-height: 52px; align-items: center; text-align: center">
<div>Variant</div><div>Capture</div><div>Folder</div><div>Class coverage</div><div>Recommended</div><div>Annotated</div><div>Date created</div><div>Date modified</div><div>Action</div>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<div class="trow" style="display: grid; grid-template-columns: 110px 130px minmax(250px, 1.6fr) minmax(200px, 1.2fr) 160px 110px 120px 120px 70px; align-items: center; min-height: 44px; border-bottom: 1px solid #EFEFF1; font-size: 14px; {{r.bg}}">
<div style="text-align: center">{{r.variant}}</div>
<div style="text-align: center">{{r.capture}}</div>
<div style="display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 12px 4px {{r.indent}}px">
<sc-if value="{{r.isFolder}}" hint-placeholder-val="{{true}}"><button class="ibtn" onClick="{{r.toggle}}" aria-expanded="{{r.expanded}}" aria-label="{{r.expLabel}}"><span style="display: inline-flex; transition: transform .15s; {{r.chevRot}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span></button><span style="font-weight: 600">{{r.name}}</span></sc-if>
<sc-if value="{{r.isSlot}}" hint-placeholder-val="{{false}}"><button class="ibtn" onClick="{{r.toggle}}" aria-expanded="{{r.expanded}}" aria-label="{{r.expLabel}}"><span style="display: inline-flex; transition: transform .15s; {{r.chevRot}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span></button><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>{{r.name}}</span></sc-if>
<sc-if value="{{r.isDs}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E25000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg><span style="color: #2F55C9">{{r.name}}</span><sc-if value="{{r.hasImgs}}" hint-placeholder-val="{{true}}"><button class="link" style="font-size: 13px" onClick="{{r.open}}">View Annotations</button></sc-if></sc-if>
<sc-if value="{{r.isAdd}}" hint-placeholder-val="{{false}}"><button onClick="{{r.add}}" style="background: none; border: 0; padding: 4px 0; color: #2F55C9; font-weight: 600; font-size: 13px; cursor: pointer">+ Add dataset</button></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px"><sc-for list="{{r.chips}}" as="ch"><span class="chip" style="{{ch.style}}">{{ch.label}}</span></sc-for></div>
<div style="display: flex; align-items: center; justify-content: center; gap: 6px">
<sc-if value="{{r.recDash}}" hint-placeholder-val="{{true}}"><span style="color: #A1A1AA">—</span></sc-if>
<sc-if value="{{r.recNum}}" hint-placeholder-val="{{false}}"><span style="font-weight: 700; color: #18181B">{{r.recText}}</span></sc-if>
<sc-if value="{{r.recRun}}" hint-placeholder-val="{{false}}"><span class="spin"></span><span style="color: #C23A00; font-weight: 600; font-size: 13px">Running</span></sc-if>
<sc-if value="{{r.recOld}}" hint-placeholder-val="{{false}}"><span style="color: #A1A1AA; {{r.oldStrike}}">{{r.recText}}</span><span title="{{r.reason}}" style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: #FEF3C7; color: #8A5300; font-size: 11px; font-weight: 700">Outdated</span></sc-if>
</div>
<div style="text-align: center; font-weight: 700; {{r.annStyle}}">{{r.ann}}</div>
<div style="text-align: center; font-size: 13px; color: #52525B">{{r.created}}</div>
<div style="text-align: center; font-size: 13px; color: #52525B">{{r.modified}}</div>

<sc-for list="{{capRows}}" as="r" hint-placeholder-count="4">
<div role="row" style="display: grid; grid-template-columns: 44px minmax(130px, 1fr) minmax(150px, 1.1fr) minmax(170px, 1.5fr); border-top: 1px solid #EFEFF1; font-size: 13px; {{r.rowStyle}}">
<div role="cell" style="padding: 12px 0; display: flex; justify-content: center; align-items: flex-start"><input type="checkbox" id="{{r.cid}}" aria-label="{{r.selLabel}}" checked="{{r.checked}}" disabled="{{r.locked}}" onChange="{{r.toggle}}" style="width: 17px; height: 17px; accent-color: #FF4A00; margin: 1px 0 0; {{r.boxStyle}}"></div>
<div role="cell" style="padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0">
<label for="{{r.cid}}" style="font-weight: 700; {{r.nameStyle}}">{{r.name}}</label>
<span style="font-size: 12px; color: #71717A">{{r.sub}}</span>
</div>
<div role="cell" style="padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span class="chip" style="{{r.pillStyle}}"><sc-if value="{{r.icRun}}" hint-placeholder-val="{{false}}"><span class="spin" style="margin-right: 6px"></span></sc-if>{{r.status}}</span>
</div>
<sc-if value="{{r.hasNote}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: #52525B">{{r.note}}</span></sc-if>
</div>
<div role="cell" style="padding: 12px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; min-width: 0"><sc-for list="{{r.clsChips}}" as="d"><span class="chip" style="{{d.style}}">{{d.text}}</span></sc-for></div>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid #EFEFF1">
<span style="flex: 1; font-size: 13px; color: #52525B">{{selText}}</span>
<button onClick="{{closeModal}}" style="height: 38px; padding: 0 16px; border: 1px solid #D4D4D8; background: #FFFFFF; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer">Cancel</button>
<sc-if value="{{showAdvanced}}" hint-placeholder-val="{{false}}">
<span style="display: inline-flex; align-items: center; gap: 6px">
<button onClick="{{setupAdvanced}}" style="height: 38px; padding: 0 16px; border: 1px solid #FF4A00; background: #FFFFFF; color: #D63F00; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer">Setup Advanced Mode</button>
<span class="tip" tabindex="0" aria-label="Gives optimised recommendations by combining captures with overlapping classes"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"></circle><path d="M12 11v6M12 7.5v.01"></path></svg><span class="tipbox" role="tooltip">Gives optimised recommendations by combining captures with overlapping classes</span></span>
</span>
</sc-if>
<button onClick="{{run}}" disabled="{{runDisabled}}" style="height: 38px; padding: 0 18px; border: 0; border-radius: 8px; font-weight: 700; font-size: 14px; {{runStyle}}">{{runText}}</button>
</div>
</sc-if>
<sc-if value="{{isAdvanced}}" hint-placeholder-val="{{false}}">
<div style="padding: 14px 20px; display: flex; flex-direction: column; gap: 12px; max-height: 560px; overflow-y: auto">
<sc-if value="{{hasPool}}" hint-placeholder-val="{{false}}">
<div style="border: 1px dashed #F0A37E; border-radius: 10px; background: #FFF8F4">
<div style="padding: 9px 14px; font-size: 13px; font-weight: 700; color: #B23400; border-bottom: 1px dashed #F6C9B4">Unassigned</div>
<sc-for list="{{pool}}" as="u">
<div style="display: flex; align-items: center; gap: 10px; padding: 9px 14px; flex-wrap: wrap">
<span style="font-weight: 700; font-size: 13px; min-width: 140px">{{u.name}}</span>
<span style="display: flex; gap: 4px; flex: 1; flex-wrap: wrap"><sc-for list="{{u.chips}}" as="c"><span class="chip" style="{{c.style}}">{{c.label}}</span></sc-for></span>
<select aria-label="{{u.pickLabel}}" value="" onChange="{{u.pick}}" style="height: 32px; padding: 0 8px; border: 1px solid #D4D4D8; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 600; background: #FFFFFF; cursor: pointer">
<option value="">Assign to…</option>
<sc-for list="{{u.options}}" as="o"><option value="{{o.value}}">{{o.label}}</option></sc-for>
</select>
</div>
</sc-for>
</div>
</sc-if>
<sc-for list="{{advGroups}}" as="g" hint-placeholder-count="2">
<div style="border: 1px solid #EAEAEC; border-radius: 10px; overflow: hidden">
<div style="display: flex; align-items: baseline; gap: 10px; padding: 9px 14px; background: #FAFAFA; border-bottom: 1px solid #EFEFF1">
<span style="font-size: 13px; font-weight: 700">{{g.title}}</span>
<span style="font-size: 12px; {{g.noteStyle}}">{{g.note}}</span>
</div>
<sc-for list="{{g.members}}" as="m">
<div style="display: flex; align-items: center; gap: 10px; padding: 9px 8px 9px 14px; border-top: 1px solid #F4F4F5; flex-wrap: wrap">
<span style="font-weight: 700; font-size: 13px; min-width: 140px">{{m.name}}</span>
<span style="display: flex; gap: 4px; flex: 1; flex-wrap: wrap"><sc-for list="{{m.chips}}" as="c"><span class="chip" style="{{c.style}}">{{c.label}}</span></sc-for></span>
<button class="ibtn" aria-label="{{m.removeLabel}}" title="Unassign" onClick="{{m.remove}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid #EFEFF1">
<span style="flex: 1; font-size: 13px; color: #52525B">{{advText}}</span>
<button onClick="{{backToSelect}}" style="height: 38px; padding: 0 16px; border: 1px solid #D4D4D8; background: #FFFFFF; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer">Back</button>
<sc-if value="{{allAssigned}}" hint-placeholder-val="{{false}}"><button onClick="{{runAdvanced}}" style="height: 38px; padding: 0 18px; border: 0; border-radius: 8px; font-weight: 700; font-size: 14px; background: #FF4A00; color: #FFFFFF; cursor: pointer">Run Advanced Mode</button></sc-if>
</div>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #18181B; color: #FFFFFF; padding: 11px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 30; max-width: min(620px, calc(100vw - 32px)); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25)">{{toast}}</div>
</sc-if>
</div>
</template>

      ready: ['Ready to run', 'background:#E8F6EE; color:#1E7A43;'],
      outdated: ['Outdated', 'background:#FFF4E5; color:#B45309;'],
      running: ['Running', 'background:#EEF2FF; color:#3B4CCA;'],
      notready: ['Missing classes', 'background:#FDECEC; color:#B42318;'],
      uptodate: ['Up to date', 'background:#F4F4F5; color:#52525B;']
    };
    return s.caps.map(c => ({ c: c, g: this.group(s, c) }))
      .sort((x, y) => order.indexOf(x.g) - order.indexOf(y.g))
      .map(({ c, g }) => {
        const r = this.readiness(s, c);
        const nF = s.folders.filter(f => f.cap === c.id).length;
        const sel = g === 'ready' || g === 'outdated';
        const checked = sel && !!s.sel[c.id];
        let note = '';
        if (g === 'outdated') note = c.rec.reason;
        else if (g === 'running' && c.rec.dirty) note = 'Folders changed meanwhile, result will land as outdated';
        else if (g === 'uptodate') note = 'Generated ' + c.rec.at;
        else if (g === 'notready' && c.rec.state === 'outdated') note = 'Last result is outdated';
        return {
          cid: 'sel-' + c.id, name: c.variant + ' · ' + c.name, sub: nF + (nF === 1 ? ' folder' : ' folders'),
          selLabel: 'Select ' + c.variant + ' · ' + c.name, checked: checked, locked: !sel, toggle: () => this.toggleSel(c.id),
          boxStyle: sel ? 'cursor:pointer;' : 'cursor:not-allowed; opacity:.45;', nameStyle: sel ? 'cursor:pointer;' : 'color:#71717A;',
          rowStyle: checked ? 'background:#FFF8F4;' : '',
          status: pills[g][0], pillStyle: pills[g][1], icRun: g === 'running',
          hasNote: !!note, note: note,
          clsChips: c.classes.map(x => {
            const d = r.defs.find(y => y.cls === x && y.kind === 'present');
            return { text: this.N[x] + (d ? ' · ' + d.n + ' more' : ''), style: this.chipStyle(x, false) };
          }).concat(r.defs.filter(d => d.kind !== 'present').map(d => ({ text: this.N[d.cls] + this.KIND[d.kind] + ' · ' + d.n + ' more', style: this.chipStyle(d.cls, true) }))),
          canAnnotate: g === 'notready' && !!c.live, annotate: () => this.annotateCap(c.id)
        };
      });
  }

  renderVals() {
    const s = this.state;
    const runSecs = this.props.runSeconds ?? 8;
    const v = {
      isWizard: s.screen === 'wizard', isDatasets: s.screen === 'datasets', isAnnot: s.screen === 'annotate',
      runSecs: runSecs, modal: s.modal, hasToast: !!s.toast, toast: s.toast || '',
      fillReady: () => this.fillReady(), autoLabel: () => this.autoLabel(), reset: () => this.reset()
    };


    // AI Model Training
    const t = s.train;
    v.isTraining = s.screen === 'training';
    v.goTraining = () => this.goTraining(); v.goDatasets = () => this.goDatasets();
    v.chipD = this.clsChipStyle('D', false);
    v.trainOpen = t.open; v.stop = e => e.stopPropagation();
    v.openTrain = e => { e.stopPropagation(); this.mut(st => { st.train = Object.assign(this.initial().train, { open: true }); }); };
    v.closeTrain = () => this.setTrain(x => { x.open = false; });
    const TL = ['Model Name', 'Modules & Classes', 'Datasets', 'Model Configuration', 'Review'];
    v.tlFill = 'height:' + (100 * (t.step - 1) / (TL.length - 1)) + '%;';
    v.tlSteps = TL.map((n, i) => ({
      name: n, tick: t.step > i + 1 ? '✔' : '',
      dot: t.step >= i + 1 ? 'background:#ff4301;' : 'background:#fff; border:1px solid #E5E7EB;',
      label: t.step === i + 1 ? 'font-weight:600; color:black;' : 'font-weight:400; color:gray;'
    }));
    v.tStep1 = t.step === 1; v.tStep2 = t.step === 2;
    const pre = (this.STORE_MODULES.find(m => m.id === t.module) || {}).prefix || '';
    v.tModules = this.STORE_MODULES; v.tModule = t.module; v.tModuleErr = t.modErr;
    v.tName = t.name; v.tDesc = t.desc; v.tNameErr = t.nameErr; v.tDescErr = t.descErr;
    v.tPickModule = e => { const id = e.target.value; this.setTrain(x => {
      const old = (this.STORE_MODULES.find(m => m.id === x.module) || {}).prefix || '';
      const suffix = x.name.indexOf(old) === 0 ? x.name.slice(old.length) : x.name;
      if (x.module !== id) x.sel = [];
      x.module = id; x.modErr = false; x.name = ((this.STORE_MODULES.find(m => m.id === id) || {}).prefix || '') + suffix;
    }); };
    v.tSetName = e => { let val = e.target.value; if (val.indexOf(pre) !== 0) val = pre + val.replace(pre.slice(0, -1), '').replace(pre, ''); this.setTrain(x => {
      x.name = val; x.nameErr = val.length > 50 ? 'Max length is 50 characters' : '';
    }); };
    v.tSetDesc = e => { const val = e.target.value; this.setTrain(x => { x.desc = val; x.descErr = val.length > 150 ? 'Max length is 150 characters' : ''; }); };
    v.tNext1 = () => this.setTrain(x => {
      if (!x.name || !x.name.trim() || x.name.trim() === pre.trim()) { x.nameErr = 'Please enter a name for the AI model.'; return; }
      if (!x.desc || !x.desc.trim()) { x.descErr = 'Please enter a description for the AI model.'; return; }
      if (!x.module) { x.modErr = true; return; }
      x.step = 2;
    });
    // step 1 needs a module before name/desc show, so surface the module error first
    const next1 = v.tNext1; v.tNext1 = () => { if (!t.module) this.setTrain(x => { x.modErr = true; }); else next1(); };
    const mods = t.module === 'assembly' ? this.TRAIN_MODULES.slice().sort((a, b) => a.variant.localeCompare(b.variant)) : [];
    v.tNoRows = mods.length === 0;
    v.tSelErr = t.selErr && t.sel.length === 0;
    v.tRows = mods.map(m => {
      const why = this.trainConflict(t, m), on = t.sel.indexOf(m.id) >= 0;
      return {
        variant: m.variant, capture: m.capture, module: m.name, checked: on, ariaChecked: on ? 'true' : 'false', disabled: !!why, why: why,
        cbClass: 'fv-cb' + (on ? ' on' : ''), tipClass: 'fv-tip' + (why ? ' off' : ''), cbLabel: 'Select ' + m.name + ' (' + m.capture + ')',
        toggle: () => this.setTrain(x => { x.selErr = false; x.sel = on ? x.sel.filter(i => i !== m.id) : x.sel.concat([m.id]); }),
        classes: m.classes.map(c => ({ name: this.N[c], style: this.clsChipStyle(this.N[c], false), title: '' }))
      };
    });
    v.tBack2 = () => this.setTrain(x => { x.sel = []; x.step = 1; });
    v.tNext2 = () => { if (!t.sel.length) { this.setTrain(x => { x.selErr = true; }); return; } this.say('Datasets step is not part of this prototype'); };

    // wizard
    const c2 = s.caps.find(c => c.id === 'c2');
    v.classRows = ['odc2', 'odc1', 'odc3'].map(c => {
      const negs = (c2.neg || []).filter(n => c2.negOf[n] === c);
      return { name: this.N[c], absent: c2.absent.indexOf(c) >= 0, absentLabel: 'Absent case for ' + this.N[c], hasNeg: negs.length > 0, noNeg: negs.length === 0, negChips: this.chips(negs) };
    });
    const negNames = (c2.neg || []).map(n => this.N[n]);
    const list = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1] : a[0] || '';
    v.hasNegNote = negNames.length > 0;
    v.negNote = list(negNames) + (negNames.length > 1 ? ' are' : ' is') + ' set as a negative class here. A class can’t be both normal and negative in one training job, so a module with '
      + list(negNames) + ' as a negative class can’t be trained together with a module where ' + (negNames.length > 1 ? 'they are' : 'it is') + ' a normal class.';
    v.wizFolders = s.wiz.map(k => {
      const lock = this.wizLock(s, k);
      return { name: k.split('|').map(c => this.N[c]).join(' & '), chips: this.chips(k.split('|')), locked: !!lock, lockReason: lock || 'Remove folder', delLabel: 'Remove folder ' + k.split('|').map(c => this.N[c]).join(' & '), del: () => this.toggleWiz(k) };
    });
    v.wizCombos = this.COMBOS.map((k, i) => {
      const checked = s.wiz.indexOf(k) >= 0;
      const lock = checked ? this.wizLock(s, k) : '';
      return { id: 'combo-' + i, chips: this.chips(k.split('|')), checked: checked, locked: !!lock, lockReason: lock, toggle: () => this.toggleWiz(k) };
    });
    v.prevStep = () => this.prevStep(); v.finish = () => this.finish();

    // datasets
    v.showBanner = s.banner; v.dismissBanner = () => this.setState({ banner: false });
    v.filters = [{ label: 'Variant Name', n: 0 }, { label: 'Capture', n: 0 }, { label: 'Dataset Folder', n: 0 }, { label: 'Is Deleted', n: 1 }];
    let readyN = 0, runN = 0;
    s.caps.forEach(c => { const g = this.group(s, c); if (g === 'ready' || g === 'outdated') readyN++; if (g === 'running') runN++; });
    v.readyText = readyN + ' ready';
    v.readyPillStyle = readyN ? 'background:#FFFFFF; color:#B33300;' : 'background:rgba(255,255,255,0.3); color:#FFFFFF;';
    v.anyRunning = runN > 0; v.runningText = runN + (runN > 1 ? ' captures running' : ' capture running');
    v.openModal = () => this.openModal();
    v.rows = s.screen === 'datasets' ? this.buildRows(s) : [];

    // modal
    v.capRows = s.modal ? this.buildCapRows(s) : [];
    const selIds = s.caps.filter(c => this.selectable(s, c)).map(c => c.id);
    const selN = selIds.filter(id => s.sel[id]).length;
    v.allChecked = selIds.length > 0 && selN === selIds.length; v.noneSelectable = selIds.length === 0;
    v.toggleAll = () => this.toggleAll();
    v.selText = selN ? selN + (selN > 1 ? ' captures' : ' capture') + ' selected' : 'Select at least one capture';
    v.runText = 'Run Recommender';
    v.runDisabled = selN === 0;
    v.runStyle = selN ? 'background:#FF4A00; color:#FFFFFF; cursor:pointer;' : 'background:#E4E4E7; color:#A1A1AA; cursor:not-allowed;';
    v.run = () => this.run(); v.closeModal = () => this.closeModal();
    v.modalTitle = s.step === 'advanced' ? 'Advanced Mode' : 'Run Data Recommender';
    v.modalSub = s.step === 'advanced' ? 'Captures in a group are combined into one recommendation.' : 'Runs per capture and takes a few minutes. You can keep annotating while it runs.';
    v.isSelect = s.step === 'select'; v.isAdvanced = s.step === 'advanced';
    v.showAdvanced = selN > 1 && this.hasOverlap(s);
    v.setupAdvanced = () => this.setupAdvanced(); v.backToSelect = () => this.backToSelect(); v.runAdvanced = () => this.runAdvanced();
    const capLine = id => { const c = s.caps.find(x => x.id === id); return { name: c.variant + ' · ' + c.name, chips: this.chips(c.classes) }; };
    v.advGroups = s.groups.map((g, gi) => {
      const shared = s.caps.find(c => c.id === g[0]).classes.filter(x => g.every(id => s.caps.find(c => c.id === id).classes.indexOf(x) >= 0));
      const linked = g.length > 1 && g.every(a => g.some(b => b !== a && this.overlaps(s, a, b)));
      return {
        title: 'Group ' + (gi + 1),
        note: g.length === 1 ? 'Runs on its own' : (linked ? (shared.length ? 'Shared: ' + shared.map(x => this.N[x]).join(', ') : 'Linked by overlapping classes') : 'Some captures share no classes'),
        noteStyle: g.length > 1 && !linked ? 'color:#B45309;' : 'color:#71717A;',
        members: g.map(id => Object.assign(capLine(id), { remove: () => this.unassign(id), removeLabel: 'Unassign ' + capLine(id).name }))
      };
    });
    v.hasPool = s.pool.length > 0;
    v.pool = s.pool.map(id => Object.assign(capLine(id), {
      options: s.groups.map((g, gi) => ({ value: String(gi), label: 'Group ' + (gi + 1) })).concat([{ value: 'new', label: 'New group' }]),
      pick: e => this.assign(id, e.target.value), pickLabel: 'Assign ' + capLine(id).name + ' to a group'
    }));
    v.allAssigned = s.step === 'advanced' && s.pool.length === 0;
    v.advText = s.pool.length ? s.pool.length + ' unassigned' : s.groups.length + (s.groups.length > 1 ? ' groups' : ' group') + ' · ' + this.selIds(s).length + ' captures';

    // annotation
    const ctx = s.screen === 'annotate' ? this.curCtx(s) : null;
    Object.assign(v, {
      folderName: '', dsName: '', imgName: '', folderChips: [], absentChips: [], hasAbsentChips: false, absentNeeded: false, absentHint: '', clsChips: [], boxList: [], noBoxes: true,
      pager: [], prevDisabled: true, nextDisabled: true, rangeText: '', hintText: '', hintStyle: '', drawing: false, cursor: '', boxes: [], hasDrag: false, dragStyle: '',
      hasOdc2: true, hasOdc3: true, hasOdc4: false
    });
    v.back = () => this.back(); v.copyMaster = () => this.copyMaster(); v.saveNext = () => this.saveNext();
    v.prevImg = () => this.stepImg(-1); v.nextImg = () => this.stepImg(1); v.stopDraw = () => this.stopDraw();
    v.down = (e) => this.down(e); v.move = (e) => this.move(e); v.up = () => this.up();
    if (ctx) {
      const img = ctx.img, folder = ctx.folder, cap = ctx.cap;
      v.folderName = this.fname(folder); v.dsName = ctx.ds.name; v.imgName = img.name; v.folderChips = this.chips(folder.classes);
      v.hasOdc2 = folder.classes.indexOf('odc2') >= 0; v.hasOdc3 = folder.classes.indexOf('odc3') >= 0; v.hasOdc4 = folder.classes.indexOf('odc4') >= 0;
      // Recommender-only chips (absent / negative): shown only on the first WINDOW eligible images of
      // the capture. The count includes this image's unsaved boxes so it moves as the user draws.
      const r = this.readiness(s, cap);
      const savedImgs = this.imgsOfCap(s, cap.id).filter(i => i.saved);
      const items = [];
      (cap.absent || []).forEach(c => items.push({ c: c, kind: 'absent' }));
      (cap.neg || []).forEach(c => items.push({ c: c, kind: 'neg' }));
      v.absentChips = items.filter(it => this.specialImages(s, cap.id, it.c, it.kind).some(i => i.id === img.id)).map(it => {
        const c = it.c, kind = it.kind, k = this.CL[c];
        const have = this.countKind(savedImgs, c, kind) + (img.saved ? 0 : this.countKind([img], c, kind));
        const need = this.NEED[kind];
        const short = have < need;
        const sp = s.special; const on = !!sp && sp.cls === c && sp.kind === kind;
        const border = kind === 'absent' ? 'dashed' : 'dotted';
        return {
          label: this.N[c] + this.KIND[kind] + '  ' + Math.min(have, need) + '/' + need, needed: short,
          pick: () => this.markSpecial(c, kind), pressed: on ? 'true' : 'false',
          title: (kind === 'absent' ? 'Box where ' + this.N[c] + ' would normally sit. ' : 'Box each ' + this.N[c] + ' on the image. ') + (short ? need + ' needed in this capture to run the recommender. ' : 'Requirement met; more are optional. ') + 'Recommender only: not used for training and never blocks saving.',
          style: (short ? 'background:#FFFFFF; color:' + k.fg + '; border:1.5px ' + border + ' ' + k.box + ';' : 'background:#FFFFFF; color:#71717A; border:1.5px ' + border + ' #C4C4CC;') + (on ? ' box-shadow: 0 0 0 2px ' + k.box + '; font-weight: 700;' : '')
        };
      });
      v.hasAbsentChips = v.absentChips.length > 0;
      v.absentNeeded = v.hasAbsentChips;
      v.absentHint = 'Labels after the divider are for the recommender only. They are not used for training and never block saving.';
      v.clsChips = cap.classes.map(c => {
        const on = s.activeCls === c;
        return { label: this.N[c], pick: () => this.pick(c), pressed: on ? 'true' : 'false', style: this.chipStyle(c, false) + (on ? ' box-shadow: 0 0 0 2px ' + this.CL[c].box + '; font-weight: 700;' : '') };
      });
      const lineOf = (kind) => kind === 'absent' ? 'dashed' : (kind === 'neg' ? 'dotted' : 'solid');
      v.boxList = img.boxes.map((x, i) => ({ num: i + 1, label: this.N[x.cls] + this.KIND[this.kindOf(x)], style: this.chipStyle(x.cls, this.kindOf(x) !== 'present'), del: () => this.delBox(i), delLabel: 'Delete label ' + (i + 1) }));
      v.noBoxes = img.boxes.length === 0;
      v.boxes = img.boxes.map((x, i) => {
        const col = this.CL[x.cls].box; const kind = this.kindOf(x); const special = kind !== 'present';
        const pos = x.t < 8 ? 'top: 2px; left: 2px;' : 'top: -22px; left: -2px;';
        return {
          style: 'left:' + x.l + '%; top:' + x.t + '%; width:' + x.w + '%; height:' + x.h + '%; border:' + (kind === 'neg' ? 3 : 2) + 'px ' + lineOf(kind) + ' ' + col + ';' + (special ? ' background: rgba(255,255,255,0.10);' : ''),
          text: (i + 1) + '. ' + this.N[x.cls] + this.KIND[kind],
          labelStyle: pos + (special ? ' background:#FFFFFF; color:' + col + '; border:1px ' + lineOf(kind) + ' ' + col + ';' : ' background:' + col + '; color:#FFFFFF;')
        };
      });
      if (s.drag) {
        const d = s.drag; const sp = s.special; const col = this.CL[sp ? sp.cls : s.activeCls].box;
        v.hasDrag = true;
        v.dragStyle = 'left:' + Math.min(d.x0, d.x1) + '%; top:' + Math.min(d.y0, d.y1) + '%; width:' + Math.abs(d.x1 - d.x0) + '%; height:' + Math.abs(d.y1 - d.y0) + '%; border:2px ' + lineOf(sp ? sp.kind : 'present') + ' ' + col + '; background: rgba(255,255,255,0.12);';
      }
      const list = s.images.filter(i => i.ds === img.ds);
      const idx = list.findIndex(i => i.id === img.id);
      v.pager = list.map((im, i) => ({
        num: i + 1, go: () => this.goImg(im.id), current: i === idx ? 'page' : 'false', label: 'Image ' + (i + 1) + (im.saved ? ', annotated' : ''),
        style: i === idx ? 'font-weight:700; color:#18181B; border-bottom:2px solid #FF4A00;' : (im.saved ? 'color:#1E8E4A; font-weight:600;' : 'color:#71717A;')
      }));
      v.prevDisabled = idx <= 0; v.nextDisabled = idx >= list.length - 1;
      v.rangeText = 'Range: 1 to ' + list.length;
      if (s.special) {
        const nm = this.N[s.special.cls];
        v.hintText = s.special.kind === 'absent'
          ? 'Marking ' + nm + ' · absent: drag a box where ' + nm + ' would normally sit. Recommender only, stripped from training.'
          : 'Marking ' + nm + ' · negative: drag a box around each ' + nm + '. Recommender only, stripped from training.';
        v.hintStyle = 'background:#EEF0FF; color:#33308F; border:1px ' + (s.special.kind === 'absent' ? 'dashed' : 'dotted') + ' #7B78D6;';
      } else if (s.activeCls) {
        v.hintText = 'Drawing ' + this.N[s.activeCls] + ': drag on the image to add a box';
        v.hintStyle = 'background:' + this.CL[s.activeCls].bg + '; color:' + this.CL[s.activeCls].fg + '; border:1px solid ' + this.CL[s.activeCls].bd + ';';
      } else {
        v.hintText = 'Pick a class on the left, then drag on the image to label it';
        v.hintStyle = 'background:#F4F4F5; color:#52525B; border:1px solid #E4E4E7;';
      }
      v.drawing = !!(s.activeCls || s.special);
      v.cursor = v.drawing ? 'cursor: crosshair;' : 'cursor: default;';
    }
    return v;
  }
}


var q = new URLSearchParams(location.search);
mountDC(Component, { runSeconds: q.get('run') ? Number(q.get('run')) : undefined });
</script>
